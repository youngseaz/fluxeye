# FluxEye 后端配置（生产模板）
# 开发环境请复制为 config.dev.yaml 使用
# cp config.yaml config.dev.yaml

app:
  title: "FluxEye API"
  version: "0.1.0"
  host: "0.0.0.0"
  port: 8000
  reload: false
  log_level: "info"

storage:
  backend: sqlite
  retention_days: 7
  sqlite:
    path: ./data/fluxeye.db
    wal: true
    journal_size_limit: 1048576
  influxdb:
    url: http://localhost:8086
    token: ""
    org: fluxeye
    bucket: flow_stats
  clickhouse:
    host: localhost
    port: 9000
    database: fluxeye
    user: default
    password: ""

collector:
  interface: ""
  bpf_filter: ""
  snap_len: 65535
  promisc: true
  pcap_file: ""
  flush_interval: 5.0
  idle_timeout: 120
  dpi_lib_path: "libndpi_helper.so"
  pcap_output:
    enabled: true
    dir: ./data/captures/cache
    max_file_size_mb: 10
    max_file_count: 20
    # 大流量传输（视频流/下载等）不保存 pcap，节省磁盘
    exclude_categories:
      - video
      - streaming
      - download
      - media
      - music
      - filesharing
    exclude_protocols:
      - bittorrent
      - quic
      - http3
      - ftp_data
      - nfs
      - smbv1
      - smbv23
      - rtmp
      - mpegts
      - mpegdash
  tls_keylog:
    filepath: ./data/tls_keys.log
    auto_reload: true
    reload_interval: 5.0

geoip:
  account_id: ""
  license_key: ""
  edition_ids:
    - GeoLite2-City
    - GeoLite2-ASN
    - GeoLite2-Country
  city_db: ./data/geoip/GeoLite2-City.mmdb
  asn_db: ./data/geoip/GeoLite2-ASN.mmdb
  country_db: ./data/geoip/GeoLite2-Country.mmdb
  auto_update: false
  update_interval_days: 7
