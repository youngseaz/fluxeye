[project]
name = "fluxeye-backend"
version = "0.1.0"
description = "FluxEye DPI Visualization System - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "influxdb-client>=1.48.0",
    "clickhouse-driver>=0.2.7",
    "rrdtool>=0.1.5",
    "python-multipart>=0.0.16",
    "geoip2>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]
